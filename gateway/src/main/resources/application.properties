spring.application.name=gateway

server.port=8080

services.product.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
services.user.url=${USER_SERVICE_URL:http://localhost:8082}
services.order.url=${ORDER_SERVICE_URL:http://localhost:8083}

spring.cloud.gateway.server.webmvc.routes[0].id=product
spring.cloud.gateway.server.webmvc.routes[0].uri=${services.product.url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webmvc.routes[1].id=user
spring.cloud.gateway.server.webmvc.routes[1].uri=${services.user.url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-cart
spring.cloud.gateway.server.webmvc.routes[2].uri=${services.order.url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/cart/**

spring.cloud.gateway.server.webmvc.routes[3].id=order-orders
spring.cloud.gateway.server.webmvc.routes[3].uri=${services.order.url}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/orders/**
